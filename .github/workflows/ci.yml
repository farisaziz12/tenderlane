name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on eval(), unused code and other correctness rules (.oxlintrc.json).
      - run: pnpm lint

      # One version of each dependency across the workspace.
      - run: pnpm test:workspace

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Each package's exports, types and files resolve for consumers.
      - run: pnpm test:build
