# The PR description has what a reviewer needs (.github/pull_request_template.md): change, why,
# before → after, and screenshots when the docs site or the example app changed.
# Rules: tools/pr-rules.mjs. Writes no comments; failures show on the check.
name: pr-rules
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-rules:
    runs-on: ubuntu-latest
    steps:
      # The base branch's rules, so a PR cannot relax the check that judges it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools
      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/tools/pr-rules.mjs`);
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pull.number, per_page: 100,
            });
            const { errors, warnings } = checkPullRequest({
              body: pull.body, files: files.map((file) => file.filename),
              title: pull.title, author: pull.user.login,
            });
            await core.summary
              .addList([...errors.map((error) => `❌ ${error}`), ...warnings.map((warning) => `⚠️ ${warning}`)])
              .write();
            warnings.forEach((warning) => core.warning(warning));
            errors.forEach((error) => core.error(error));
            if (errors.length > 0) core.setFailed(`${errors.length} thing(s) missing from the PR description.`);
